<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>幸运开奖 - 食光盲盒</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        @keyframes box-jump {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .animate-box { animation: box-jump 0.6s ease-in-out infinite; }
        ::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen text-[#4A3728]">
<div class="w-[375px] h-[812px] bg-[#FFF8F0] shadow-2xl rounded-[40px] overflow-hidden border-[8px] border-[#4A3728] relative flex flex-col">
<!-- 顶部状态栏 -->
<div class="h-6 w-full flex justify-between items-center px-8 pt-4 text-xs font-bold z-50">
<span>09:41</span>
<div class="flex gap-1">
<iconify-icon icon="mdi:signal"></iconify-icon>
<iconify-icon icon="mdi:wifi"></iconify-icon>
<iconify-icon icon="mdi:battery"></iconify-icon>
</div>
</div>
<!-- 顶部导航栏 -->
<header class="px-5 py-4 flex justify-between items-center bg-[#FFF8F0]/80 backdrop-blur-md z-40">
<a class="text-[#4A3728] text-2xl" href="home.html"><iconify-icon icon="mdi:chevron-left"></iconify-icon></a>
<h1 class="text-xl font-black text-[#FF6B35]">每日盲盒开奖</h1>
<div class="w-8"></div>
</header>
<!-- 页面内容区域 -->
<main class="flex-1 overflow-y-auto no-scrollbar p-5 flex flex-col items-center justify-center space-y-8 pb-24">
<div class="relative w-48 h-48 flex items-center justify-center" id="blindbox-container">
<div class="w-32 h-32 bg-[#FF6B35] rounded-2xl shadow-xl flex items-center justify-center text-6xl relative z-10" id="box-visual">
                    📦
                </div>
<div class="absolute inset-0 bg-orange-300 rounded-full blur-3xl opacity-20 animate-pulse"></div>
</div>
<div class="text-center" id="draw-btn-container">
<button class="bg-[#FF6B35] text-white px-12 py-4 rounded-full font-black text-lg shadow-lg shadow-orange-200 active:scale-95 transition-all" onclick="drawBlindBox()">
                    立即开奖
                </button>
<p class="mt-4 text-xs text-gray-400">每人每天仅限一次机会</p>
</div>
<!-- 开奖结果 -->
<div class="hidden w-full space-y-6 animate-fade-in" id="prize-result">
<div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-[#FF6B35] text-center relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-2 bg-[#FF6B35]"></div>
<p class="text-[#FF6B35] font-black text-xl mb-4" id="prize-title">🎉 免单券！</p>
<div class="flex items-center justify-center gap-4 mb-4">
<span class="text-5xl" id="prize-emoji">🍗</span>
<div class="text-left">
<p class="font-bold" id="prize-dish">黄焖鸡米饭</p>
<p class="text-xs text-gray-400" id="prize-win">一食堂·黄焖鸡窗口</p>
</div>
</div>
<div class="bg-gray-50 rounded-xl p-3 border border-dashed border-gray-200">
<p class="text-xs text-gray-400 mb-1">今日暗号</p>
<p class="text-lg font-black tracking-widest" id="prize-code">食光8888</p>
</div>
</div>
<a class="block w-full text-center py-4 text-[#4A3728] font-bold" href="home.html">返回首页</a>
</div>
</main>
<!-- 底部导航栏 -->
<nav class="absolute bottom-0 w-full bg-white/90 backdrop-blur-lg border-t border-gray-100 px-6 py-3 pb-8 flex justify-between items-center z-50 safe-bottom">
<a class="flex flex-col items-center gap-1 text-[#FF6B35]" href="home.html">
<iconify-icon class="text-2xl" icon="mdi:home-variant"></iconify-icon>
<span class="text-[10px] font-bold">首页</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-400" href="canteen.html">
<iconify-icon class="text-2xl" icon="mdi:silverware-fork-knife"></iconify-icon>
<span class="text-[10px] font-bold">食堂</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-400" href="fav.html">
<iconify-icon class="text-2xl" icon="mdi:heart"></iconify-icon>
<span class="text-[10px] font-bold">收藏</span>
</a>
<a class="flex flex-col items-center gap-1 text-gray-400" href="me.html">
<iconify-icon class="text-2xl" icon="mdi:account"></iconify-icon>
<span class="text-[10px] font-bold">我的</span>
</a>
</nav>
</div>
<script>
        const prizes = [
            "🎉 免单券！本次用餐免费！",
            "🎉 第二份半价券",
            "🎉 加菜券（免费加小菜）",
            "🎉 5元优惠券",
            "🎉 谢谢参与，下次好运～"
        ];
        const dishes = [
            {name:"麻辣香锅", win:"一食堂·香锅窗口", emoji:"🌶️"},
            {name:"牛肉饭", win:"二食堂·牛肉饭窗口", emoji:"🥩"},
            {name:"黄焖鸡米饭", win:"一食堂·黄焖鸡窗口", emoji:"🍗"}
        ];

        function drawBlindBox() {
            const box = document.getElementById('box-visual');
            const btnCont = document.getElementById('draw-btn-container');
            const result = document.getElementById('prize-result');
            
            box.classList.add('animate-box');
            btnCont.classList.add('opacity-0', 'pointer-events-none');

            setTimeout(() => {
                box.classList.add('hidden');
                const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
                const randomDish = dishes[Math.floor(Math.random() * dishes.length)];
                const randomCode = "食光" + Math.floor(1000 + Math.random() * 9000);

                document.getElementById('prize-title').innerText = randomPrize;
                document.getElementById('prize-emoji').innerText = randomDish.emoji;
                document.getElementById('prize-dish').innerText = randomDish.name;
                document.getElementById('prize-win').innerText = randomDish.win;
                document.getElementById('prize-code').innerText = randomCode;

                result.classList.remove('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
